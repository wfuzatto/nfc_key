plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grupovaledamantiqueira.nfckey'
    compileSdk 35

    defaultConfig {
        applicationId 'com.grupovaledamantiqueira.nfckey'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-lab'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
